name: Publish to MCP Registry

# Publishes server/server.json to the official MCP Registry
# (registry.modelcontextprotocol.io). Uses GitHub OIDC — the workflow runs in
# SharpLu/ko-mcp, which proves ownership of the io.github.SharpLu/* namespace,
# so there are no secrets or tokens to manage. This is a remote server
# (server.json has `remotes`, not `packages`), so no package registry step.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
