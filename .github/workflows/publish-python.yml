name: Publish ko-sec (PyPI)

# Publishes the Python SDK to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no long-lived token stored anywhere.
# One-time setup: on pypi.org add a "pending publisher" for project `ko-sec`,
# owner `SharpLu`, repo `ko-mcp`, workflow `publish-python.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
