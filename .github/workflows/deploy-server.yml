name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Upload Worker version
        id: upload
        run: |
          # Run wrangler directly so its errors stream to the log (an
          # OUTPUT=$(...) under `bash -e` would swallow the real error).
          npx wrangler versions upload 2>&1 | tee /tmp/wrangler-upload.log
          VERSION_ID=$(grep -oP 'Worker Version ID: \K[a-f0-9-]+' /tmp/wrangler-upload.log)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker version
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" -y
      - name: Verify deployment
        working-directory: .
        run: |
          sleep 5
          curl -sSf https://mcp.ko.io/health
          TOOLS=$(curl -sS -X POST https://mcp.ko.io/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["result"]["tools"]))')
          echo "tools/list -> $TOOLS tools"
          test "$TOOLS" -ge 24

  # ---------------------------------------------------------------------------
  # Telegram notification (inline, best-effort)
  #
  # 2026-07-14 incident: this job previously called the CROSS-REPO reusable
  # workflow `SharpLu/airflow-project/.github/workflows/notify-telegram.yml@main`.
  # A server/** merge triggered this workflow and it FAILED at SETUP -- 0 jobs
  # ran, GitHub reported "This run likely failed because of a workflow file
  # issue", and the run could not be retried. That signature is the classic
  # cross-repo reusable-workflow resolution/permission failure: the `uses:`
  # reference is resolved at workflow-SETUP time, BEFORE any job runs, so a
  # resolution failure kills the ENTIRE workflow -- including the deploy job --
  # not just notify. The caller<->reusable interface matched exactly (same
  # inputs + secrets airflow-project's own deploy.yml passes), so this was NOT a
  # with:/secrets: mismatch; only the cross-repo resolution differed.
  #
  # Fix: inline the Telegram send as a normal job with plain steps (pattern
  # copied from notify-telegram.yml's body: HTML parse mode, escape <>&, jq
  # payload). The deploy no longer depends on cross-repo workflow resolution, so
  # it can never be blocked at setup by it again. The send is best-effort
  # (continue-on-error + exit 0), never failing the overall run.
  # ---------------------------------------------------------------------------
  notify:
    name: Telegram notification
    needs: deploy
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        continue-on-error: true
        env:
          STATUS: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail

          if [ -z "${BOT:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID missing; skipping notification"
            exit 0
          fi

          case "$STATUS" in
            success) ICON="🟢" ; LABEL="SUCCESS" ;;
            failure) ICON="🔴" ; LABEL="FAILED" ;;
            cancelled) ICON="🟡" ; LABEL="CANCELLED" ;;
            *) ICON="⚪" ; LABEL="$STATUS" ;;
          esac

          SHORT_SHA="${SHA:0:7}"

          # HTML mode: escape only <, >, & per Telegram HTML spec. Robust against
          # commit messages with backticks / asterisks / brackets that break
          # parse_mode=Markdown.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          MSG_LINE_RAW=$(printf '%s' "$COMMIT_MSG" | head -1 | cut -c1-100)
          MSG_LINE=$(esc "$MSG_LINE_RAW")
          REPO_E=$(esc "$REPO")
          WORKFLOW_E=$(esc "$WORKFLOW")
          BRANCH_E=$(esc "${BRANCH:-?}")

          TEXT="${ICON} <b>CI ${LABEL}</b> -- <code>${REPO_E}</code>
          <b>Workflow:</b> ${WORKFLOW_E}
          <b>Branch:</b> ${BRANCH_E}
          <b>Commit:</b> <code>${SHORT_SHA}</code>
          ${MSG_LINE}
          <a href=\"${RUN_URL}\">Logs</a>"

          HTTP_CODE=$(curl -sS -o /tmp/tg.out -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$CHAT" --arg t "$TEXT" \
                '{chat_id: $c, text: $t, parse_mode: "HTML", disable_web_page_preview: true}')") || true

          echo "Telegram HTTP ${HTTP_CODE:-none}"
          head -c 500 /tmp/tg.out 2>/dev/null || true
          echo ""
          # Best-effort: never fail CI on a Telegram outage / API change.
          exit 0
