name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.verify.outputs.outcome }}
      notified: ${{ steps.verify.outputs.notified }}
      rolled_back_to: ${{ steps.verify.outputs.rolled_back_to }}
      failed_check: ${{ steps.verify.outputs.failed_check }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run type-check
      - run: npm test

      # -----------------------------------------------------------------------
      # Golden contract gate -- BLOCKING, and deliberately BEFORE the upload.
      #
      # `tools/list >= 24` in the Verify step counts names. It is satisfied by a
      # Worker that renders every table with a header and no body, which is what
      # happens when ko-api renames a field upstream. This step replays 71
      # recorded tool calls against the Worker built from THIS commit and fails
      # if the response CONTRACT moved -- envelope shape, isError, content-block
      # type, headings, table columns, section order, error class. Values are
      # never compared, so a data refresh is a no-op.
      #
      # It runs pre-deploy on purpose. ko-api#231's gate probed a public URL and
      # graded the PREVIOUS build out of the edge cache; this one boots
      # `wrangler dev` on an ephemeral loopback port (no Cloudflare credentials
      # needed) and refuses any non-loopback base outright, so there is no
      # published artefact it could confuse with this one -- and red here means
      # nothing was uploaded at all.
      #
      # Docs, including when re-recording a fixture is legitimate and when a
      # diff is a regression: server/docs/GOLDEN_CONTRACT.md
      # -----------------------------------------------------------------------
      # timeout-minutes is a BACKSTOP, not the fix. The gate itself does ~70s of
      # work; the 2026-09-12 incident was a process that finished in 7 seconds
      # and then never exited, holding the deploy lane for 25.9 minutes until a
      # human cancelled it. The process-group kill and the explicit exit(0) in
      # scripts/ are the fix. This line is what makes the NEXT non-exit a loud
      # 6-minute failure instead of a silent 6-hour job.
      - name: Golden contract gate (pre-deploy, local build)
        timeout-minutes: 6
        run: npm run golden:gate

      # Rollback target FIRST. Cloudflare gradual deploys make a rollback a
      # VERSION ID, not an image tag, and the id must be read before the upload:
      # afterwards `wrangler versions list` contains the new version and any
      # "the previous one is the other one" assumption silently inverts. This
      # step reads the live traffic split (`wrangler deployments status --json`,
      # which answers "what is serving?" -- `versions list` only answers "what
      # was uploaded?") and prints the full rollback command to the log before
      # anything changes, so a human has a working command even if every step
      # below fails or the runner dies mid-deploy.
      # -----------------------------------------------------------------------
      - name: Capture rollback target and print the rollback command (pre-upload)
        id: capture
        run: node scripts/deploy-guard.mjs capture

      - name: Upload Worker version
        id: upload
        run: node scripts/deploy-guard.mjs upload

      - name: Deploy Worker version to 100% of traffic
        run: node scripts/deploy-guard.mjs deploy --version-id ${{ steps.upload.outputs.version_id }}

      # -----------------------------------------------------------------------
      # Health + tools/list >= 24 + golden contract (wave M1; SKIPPED, never
      # silently passed, until its runner lands). On failure this step rolls
      # back to the pre-upload version, RE-RUNS the same checks against the
      # rolled-back Worker, posts the detail to Discord #deploys and exits
      # non-zero (20 rolled back and healthy / 21 rollback not healthy / 22 no
      # rollback target). The failed version is left in Cloudflare's version
      # history for forensics -- nothing here deletes a version.
      # -----------------------------------------------------------------------
      - name: Verify deployment, roll back automatically on failure
        id: verify
        env:
          DISCORD_WEBHOOK_DEPLOYS: ${{ secrets.DISCORD_WEBHOOK_DEPLOYS }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/deploy-guard.mjs verify
          --deployed ${{ steps.upload.outputs.version_id }}
          --previous ${{ steps.capture.outputs.previous_version_id }}

  # ---------------------------------------------------------------------------
  # Discord notification (inline, best-effort)
  #
  # 2026-07-14 incident: this job previously called the CROSS-REPO reusable
  # workflow `SharpLu/airflow-project/.github/workflows/notify.yml@main`.
  # A server/** merge triggered this workflow and it FAILED at SETUP -- 0 jobs
  # ran, GitHub reported "This run likely failed because of a workflow file
  # issue", and the run could not be retried. That signature is the classic
  # cross-repo reusable-workflow resolution/permission failure: the `uses:`
  # reference is resolved at workflow-SETUP time, BEFORE any job runs, so a
  # resolution failure kills the ENTIRE workflow -- including the deploy job --
  # not just notify. The caller<->reusable interface matched exactly (same
  # inputs + secrets airflow-project's own deploy.yml passes), so this was NOT a
  # with:/secrets: mismatch; only the cross-repo resolution differed.
  #
  # Fix: inline the Discord send as a normal job with plain steps (pattern
  # copied from notify.yml's body: HTML parse mode, escape <>&, jq
  # payload). The deploy no longer depends on cross-repo workflow resolution, so
  # it can never be blocked at setup by it again. The send is best-effort
  # (continue-on-error + exit 0), never failing the overall run.
  #
  # 2026-09-12: skipped when the verify step already sent the detailed rollback
  # message, so an auto-rollback produces ONE #deploys message, not two.
  # ---------------------------------------------------------------------------
  notify:
    name: Discord notification
    needs: deploy
    if: always() && github.event_name == 'push' && needs.deploy.outputs.notified != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification (#deploys)
        continue-on-error: true
        env:
          STATUS: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOYS }}
        run: |
          set -uo pipefail
          [ -n "${HOOK:-}" ] || { echo "::warning::DISCORD_WEBHOOK_DEPLOYS missing; skipping"; exit 0; }
          case "$STATUS" in
            success) COLOR=3066993;  LABEL="SUCCESS" ;;
            failure) COLOR=15158332; LABEL="FAILED" ;;
            cancelled) COLOR=15105570; LABEL="CANCELLED" ;;
            *) COLOR=9807270; LABEL="$STATUS" ;;
          esac
          MSG_LINE=$(printf '%s' "$COMMIT_MSG" | head -1 | cut -c1-100)
          HTTP_CODE=$(curl -sS -o /tmp/dc.out -w "%{http_code}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "CI ${LABEL} -- ${REPO}" \
                      --arg d "**Workflow:** ${WORKFLOW}
          **Branch:** ${BRANCH:-?}
          **Commit:** \`${SHA:0:7}\` ${MSG_LINE}
          [Logs](${RUN_URL})" --argjson c "$COLOR" \
                  '{embeds:[{title:$t, description:$d, color:$c}]}')" "$HOOK")
          echo "Discord HTTP $HTTP_CODE"
          exit 0
