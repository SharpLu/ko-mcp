name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python SDK (${{ matrix.python-version }})
    # Stays hosted in wave 1: this job already fans out to 3 python versions, and one
    # ephemeral runner per repo would serialise them. See `server` below.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest -q

  typescript:
    name: TypeScript (${{ matrix.package }})
    # Stays hosted in wave 1: this job already fans out to 2 TS packages, and one
    # ephemeral runner per repo would serialise them. See `server` below.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, mcp-proxy]
    defaults:
      run:
        working-directory: typescript/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  server:
    name: MCP Server (mcp.ko.io worker)
    # ko-bastion#115 wave 1. Primary leg on the A3 self-hosted ARM runner so an
    # Actions BILLING failure cannot stop this gate -- on 2026-09-12 the spending
    # limit tripped and every job in SharpLu/* died at job start, all day.
    #
    # The ubuntu-latest leg is a CONTROL, not a failover: continue-on-error means it
    # can never block a merge, and its only job is to surface a disagreement between
    # the two environments. fail-fast: false stops either leg cancelling the other.
    #
    # `server` goes first in this repo because it is the only SINGLE job here. The
    # other two already carry matrices (3 python versions, 2 TS packages), and A3
    # runs ONE ephemeral runner per repo -- a runner takes one job and deregisters --
    # so adding a leg there turns 3 parallel hosted jobs into 6 serial ones. That is
    # a capacity decision, not a correctness one, and it belongs in wave 2 with a
    # measured runtime rather than in the change that introduces the runner.
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { on: '["self-hosted","linux","arm64","ko"]', primary: true }
          - { on: '["ubuntu-latest"]',                    primary: false }
    runs-on: ${{ fromJSON(matrix.leg.on) }}
    continue-on-error: ${{ !matrix.leg.primary }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
