name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest -q

  typescript:
    name: TypeScript (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, mcp-proxy]
    defaults:
      run:
        working-directory: typescript/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  server:
    name: MCP Server (mcp.ko.io worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test

  # Added by the M2 tool-registry PR. Kept as its own job so it can fail on its
  # own terms: the `server` job answers "does the worker build and pass tests",
  # this one answers "does what the tools send still match what ko-api reads".
  registry:
    name: Tool registry + ko-api pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: a real ko-api checkout turns the drift check from a warning
      # into a blocking comparison. ko-api is private and this repo's CI has no
      # guaranteed credential for it, so the step must not be required to exist.
      - name: Check out ko-api (optional, enables the drift check)
        id: ko_api
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: SharpLu/ko-api
          path: ko-api-upstream
          token: ${{ secrets.KO_API_READ_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: server
        run: npm ci

      # Offline and blocking: pin integrity (snapshot bytes hash to the recorded
      # blob SHA), pin age, tool completeness, behaviour, route existence, param
      # contract, truncation contract, plan gating, known-defect assertions.
      - name: Registry gates
        working-directory: server
        run: npm test -- src/__tests__/registry

      - name: ko-api pin drift
        working-directory: server
        run: |
          if [ -d "$GITHUB_WORKSPACE/ko-api-upstream/.git" ]; then
            KO_API_REPO="$GITHUB_WORKSPACE/ko-api-upstream" npm run registry:check-upstream
          else
            echo "::warning title=ko-api pin not verified::No ko-api checkout (set the KO_API_READ_TOKEN secret). Drift against ko-api origin/main was NOT checked in this run; the offline pin-age gate above is the only staleness signal."
            npm run registry:check-upstream -- --allow-missing-repo
          fi
