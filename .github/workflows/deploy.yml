name: Deploy MCP Worker
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Upload Worker version
        id: upload
        run: |
          # Run wrangler directly so its errors stream to the log (the old
          # OUTPUT=$(...) under `bash -e` swallowed the real error on failure).
          npx wrangler versions upload 2>&1 | tee /tmp/wrangler-upload.log
          VERSION_ID=$(grep -oP 'Worker Version ID: \K[a-f0-9-]+' /tmp/wrangler-upload.log)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker version
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" -y

  # 2026-05-17: shared Telegram notification (reusable workflow lives in airflow-project)
  notify:
    name: Telegram notification
    needs: deploy
    if: always() && github.event_name == 'push'
    uses: SharpLu/airflow-project/.github/workflows/notify-telegram.yml@main
    with:
      status: ${{ needs.deploy.result }}
      repo: ${{ github.repository }}
      workflow: ${{ github.workflow }}
      sha: ${{ github.sha }}
      commit_message: ${{ github.event.head_commit.message }}
      branch: ${{ github.ref_name }}
    secrets:
      bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
