name = "ko-mcp-server"
# account_id comes from the CLOUDFLARE_ACCOUNT_ID env var (CI secret, or your
# own account when self-hosting) — not committed, so this repo isn't tied to
# one Cloudflare account.
main = "src/index.ts"
compatibility_date = "2025-03-03"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mcp.ko.io/*", zone_name = "ko.io" }
]

[vars]
KO_API_URL = "https://api.ko.io"
